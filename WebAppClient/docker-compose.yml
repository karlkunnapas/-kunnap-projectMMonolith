services:
  webappclient:
    container_name: chargepanel-modular-monolith-webappclient
    build:
      context: ../WebAppClient
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      chargepanel-modular-monolith-webapp:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8084"
      ApiBaseUrl: "http://chargepanel-modular-monolith-webapp:8083/"
      TZ: "Europe/Tallinn"
