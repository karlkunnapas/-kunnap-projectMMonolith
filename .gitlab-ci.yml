stages:
  - deploy

deploy:
  stage: deploy
  only:
    - main
  tags:
    - shared
  script:
    - docker --version
    - docker compose version
    - test -f project/docker-compose.yml
    - test -f project/Dockerfile
    - test -f WebAppClient/docker-compose.yml
    - test -f WebAppClient/Dockerfile
    - docker compose -f project/docker-compose.yml -f WebAppClient/docker-compose.yml -p kunnap-csharpproject config
    - docker compose -f project/docker-compose.yml -f WebAppClient/docker-compose.yml -p kunnap-csharpproject pull
    - docker compose -f project/docker-compose.yml -f WebAppClient/docker-compose.yml -p kunnap-csharpproject up --build --remove-orphans --detach || (docker compose -f project/docker-compose.yml -f WebAppClient/docker-compose.yml -p kunnap-csharpproject logs --tail=200 postgres aspnet webappclient && false)
